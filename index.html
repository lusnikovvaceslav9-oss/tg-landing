<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b141a">
  <meta name="robots" content="noindex, nofollow">
  <title>Дмитрий Басков | Официальный телеграм-канал</title>
  <meta name="description" content="Официальный телеграм-канал Дмитрия Баскова">

  <!-- TRACKING_SCRIPT_PLACEHOLDER: сюда позже вставится <script> от TgTrack -->

  <style>
    :root {
      --page: #0b141a;
      --card: rgba(14, 18, 22, 0.72);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --muted: #a8b0b8;
      --tg: #2aabee;
      --tg-hover: #229ed9;
      --tg-press: #1e8fc7;
      --radius: 28px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--page);
      background-image:
        radial-gradient(ellipse 90% 60% at 12% 8%, rgba(42, 171, 238, 0.16), transparent 55%),
        radial-gradient(ellipse 70% 50% at 92% 88%, rgba(99, 102, 241, 0.14), transparent 50%),
        radial-gradient(ellipse 50% 40% at 70% 18%, rgba(192, 132, 252, 0.08), transparent 55%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 36px 22px 22px;
      text-align: center;
      background:
        radial-gradient(ellipse 125% 85% at 50% 118%, rgba(192, 132, 252, 0.16), transparent 55%),
        radial-gradient(ellipse 95% 75% at -12% 8%, rgba(56, 189, 248, 0.14), transparent 46%),
        radial-gradient(ellipse 80% 65% at 108% 28%, rgba(99, 102, 241, 0.11), transparent 50%),
        var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow:
        0 16px 56px rgba(0, 0, 0, 0.5),
        0 6px 22px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 108px;
      height: 108px;
      margin: 0 auto 18px;
      overflow: hidden;
      color: #d7e6f2;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(160deg, #1c3a52 0%, #152433 100%);
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar.has-image span {
      display: none;
    }

    .avatar.has-image img {
      display: block;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .handle {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .offer {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-decoration: none;
      background: var(--tg);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .cta:hover {
      background: var(--tg-hover);
    }

    .cta:active {
      background: var(--tg-press);
      transform: scale(0.98);
    }

    .cta svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    @media (min-width: 480px) {
      .card {
        padding: 40px 28px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar has-image" id="avatar">
      <img id="avatarImg" src="assets/avatar.jpg" alt="Дмитрий Басков">
      <span>ДБ</span>
    </div>

    <h1>Дмитрий Басков</h1>
    <p class="handle">@dmitri_baskov</p>
    <p class="offer">Официальный телеграм-канал</p>

    <a class="cta" id="cta" href="#">
      Перейти в канал
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-2.12 2.04c-.24.24-.45.44-.7.31z"/>
      </svg>
    </a>
  </main>

  <script>
    const CHANNEL_URL = "https://t.me/dmitri_baskov";

    document.getElementById("cta").href = CHANNEL_URL;

    const avatarImg = document.getElementById("avatarImg");
    if (avatarImg.getAttribute("src")) {
      document.getElementById("avatar").classList.add("has-image");
    }
  </script>
</body>
</html>
